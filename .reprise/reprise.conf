# Shared settings. This file is committed, so a change here applies to
# everyone who has cloned the repo.

# Which assets get built and committed when you commit a tab.
# PDF and MIDI are small and worth keeping in the repo.
COMMIT_FORMATS="pdf,mid"

# Commit MP3s too?
#   0 = no (default). Audio is made on demand with ./mp3 and stays local.
#   1 = yes. Everyone gets playable audio straight from a git pull, without
#       installing MuseScore at all.
#
# Set this to 1 only if someone in the band genuinely cannot run MuseScore --
# a Windows machine where detection fails, for example. The cost is real: audio
# re-encodes to different bytes every time it is rendered, so git stores a new
# multi-megabyte copy per song per edit and can't compress between them. The
# repo will grow steadily and can't easily be slimmed down afterwards.
#
# If you do turn this on, set up Git LFS at the same time.
COMMIT_MP3=0

# MP3 quality in kbit/s. 256 is plenty for a practice reference.
MP3_BITRATE=256

# Who a bandmate should contact when something goes wrong. This appears in
# error messages and on the stop screen, so make it a name they recognise and
# a way to reach you that they actually use.
CONTACT_NAME="whoever set this up"

# Shown on the stop screen so the screenshot carries it. Optional; leave
# empty to omit the line.
CONTACT_HOW=""
